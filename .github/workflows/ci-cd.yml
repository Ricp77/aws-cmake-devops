name: CMake CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cmake-devops-demo

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Compile
        run: cmake --build build --parallel 2

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --install build --prefix "$PWD/package"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmake-package
          path: package/

  publish:
    needs: test-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define immutable release tag
        id: meta
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"


  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        env:
          NEW_IMAGE: ${{ needs.publish.outputs.image }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: eu-north-1
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_INSTANCE_ID:?Missing EC2_INSTANCE_ID}"
          : "${NEW_IMAGE:?Missing NEW_IMAGE}"

          REGISTRY="${NEW_IMAGE%%/*}"
          printf -v IMAGE_Q '%q' "$NEW_IMAGE"

          cat > deploy.sh <<SCRIPT
          set -eu
          mkdir -p /home/ec2-user/devops-release
          cd /home/ec2-user/devops-release

          if [ -f current-image ]; then
            cp current-image previous-image
          fi

          aws ecr get-login-password --region eu-north-1 |
            docker login --username AWS --password-stdin "$REGISTRY"

          IMAGE=$IMAGE_Q
          docker pull "\$IMAGE"

          if ! OUTPUT=\$(docker run --rm "\$IMAGE"); then
            echo "Nuova release fallita; rollback."
            if [ -f previous-image ]; then
              docker run --rm "\$(cat previous-image)" || true
            fi
            exit 1
          fi

          if [ "\$OUTPUT" != "OK" ]; then
            echo "Output inatteso; rollback."
            if [ -f previous-image ]; then
              docker run --rm "\$(cat previous-image)" || true
            fi
            exit 1
          fi

          echo "\$IMAGE" > current-image
          echo "Release verificata: \$IMAGE"
          SCRIPT

          jq -n --rawfile script deploy.sh \
            '{commands: [$script]}' > parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://parameters.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timeout in attesa del deployment SSM."
          exit 1
